services:
  - type: web
    name: rons-downloader
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class sync --workers 1 --threads 8 --timeout 300 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: downloads
      mountPath: /opt/render/project/src/downloads
      sizeGB: 1